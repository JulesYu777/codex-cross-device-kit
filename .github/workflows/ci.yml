name: Worktree integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            binary: bin/syncthing
          - os: windows-latest
            binary: bin/syncthing.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Fetch pinned Syncthing
        run: python bootstrap.py
      - name: Run isolated tests
        env:
          SYNCTHING_BIN: ${{ github.workspace }}/${{ matrix.binary }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
